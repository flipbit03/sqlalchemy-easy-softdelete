services:
  ##############################
  # PostgreSQL Instance
  ##############################
  pg:
    image: postgres:14
    volumes:
      - pg_db_data:/var/lib/postgresql/data
    ports:
      - "9991:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "1m"


volumes:
  pg_db_data:
