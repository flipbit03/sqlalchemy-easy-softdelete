[mypy]
packages = sqlalchemy_easy_softdelete,tests
python_version = 3.10
strict = true
allow_redefinition = true

# Tests may leave functions untyped, but the bodies of untyped functions are type checked.
[mypy-tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

# Existing tests are type checked as they are written. These keep the type: ignore comments they were
# written with.
[mypy-tests.custom_method_names.model,tests.custom_rewrite_cache_size.model,tests.default_config.model,tests.eager_loading_partial_mapped_selects.model,tests.joined_secondaries.test_joined_secondaries,tests.mapped_eager_relationships.model,tests.mapped_eager_relationships.test_mapped_eager_relationships,tests.nested_selects.model,tests.nested_selects.test_nested_selects,tests.of_type_subclasses.test_of_type_subclasses,tests.outer_joined_subqueries.model,tests.secondary_subqueries.model]
warn_unused_ignores = false

# The errors mypy finds in existing tests, by module.
[mypy-tests.default_config.test_queries]
disallow_any_generics = false
disable_error_code = assignment, attr-defined

[mypy-tests.custom_default_value.test_custom_default_value]
disable_error_code = union-attr

[mypy-tests.default_config.test_aliased_and_limited_eager_loading,tests.default_config.test_from_statement_of_a_union]
disable_error_code = var-annotated

[mypy-tests.eager_loading_partial_mapped_selects.test_eager_loading_partial_mapped_selects,tests.outer_joined_subqueries.test_outer_joined_subqueries]
disable_error_code = attr-defined
