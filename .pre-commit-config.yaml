repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "tests/snapshots/.*"
      - id: end-of-file-fixer
        exclude: "tests/snapshots/.*"
      - id: check-merge-conflict
      - id: check-yaml
        args: [ --unsafe ]
      - id: check-added-large-files
        args: [ "--maxkb=4096" ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      # Run the linter, with --fix (to sort the imports).
      - id: ruff-check
        args: [ --fix ]
        exclude: "tests/snapshots/.*"
      # Run the formatter
      - id: ruff-format
        exclude: "tests/snapshots/.*"
  - repo: local
    hooks:
      # The rewriter's layers, import cycles, and SQLAlchemy's private API kept in sa/ (see ARCHITECTURE.md).
      - id: rewriter-layers
        name: rewriter layers
        entry: python3 tools/check_layers.py
        language: system
        pass_filenames: false
        files: "^(sqlalchemy_easy_softdelete/|tools/check_layers.py)"
